steps:
  # Step 1: Run Python unit tests for contents-api
  - name: "python:3.12-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install uv
        cd api
        uv pip install --system -r requirements.txt pytest pytest-django
        pytest contents/tests.py

  # Step 2: Build container image with Cloud Build
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "api"

  # Step 3: Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}"

  # Step 4: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "5"

  # Step 5: Build React Web Frontend
  - name: "node:20"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        cd web
        npm ci
        npm run build

  # Step 6: Deploy Frontend to Firebase Hosting
  - name: "gcr.io/cloud-builders/npm"
    args: ["install", "-g", "firebase-tools"]
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        npx firebase deploy --only hosting --project "${PROJECT_ID}"

substitutions:
  _REGION: "us-central1"
  _SERVICE_NAME: "contents-api"
  _REPO_NAME: "contents-repo"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
